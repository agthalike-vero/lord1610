<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>南瓜靶場 節奏出手</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 感恩節市集裡的節奏小遊戲：溫暖、好懂、大字
   IDEA: 收成季的木頭舞台，音符像落葉一樣掉到金色判定線
   PICTURE: 中間節奏軌道＋右上角南瓜預測，佔滿第一屏
   COLOUR and TYPE: 烤栗棕底、南瓜橘、蔓越莓紅、麥穗金、鼠尾草綠；Fredoka 數字＋Noto Sans TC
   LAYOUT: 標題列→關卡分頁→舞台→操作→手機音檔→時間表與說明；手機上下疊 */
:root{color-scheme:light dark;--bg:light-dark(#fbf3e4,#1f120c);--panel:light-dark(#fffaf1,#2c1a12);--ink:light-dark(#3a2418,#f7ead6);--mute:light-dark(#7a5a44,#cdb196);--line:light-dark(#ead6bb,#4a2f22);--pump:#e07b2a;--cran:#a3243b;--gold:#e9b44c;--sage:#7f9a5a}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans TC",system-ui,sans-serif;overflow-x:clip}
.wrap{max-width:1040px;margin:0 auto;padding:14px max(3vw,12px) 40px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
h1{font-size:clamp(24px,4vw,34px);line-height:1.1;margin:0;font-weight:900;color:var(--cran)}
.lang{display:flex;gap:6px}
.lang button{min-height:40px;padding:4px 14px}
.sub{color:var(--mute);margin:6px 0 12px;font-size:15px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
.tabs button{flex:none;scroll-snap-align:start;font-family:Fredoka,"Noto Sans TC",sans-serif;font-size:18px}
.tabs button.cur{background:var(--pump);border-color:var(--pump);color:#fff}
.stage{position:relative;height:min(68vh,620px);min-height:430px;border-radius:20px;overflow:hidden;margin-top:8px;background:#2a150d;box-shadow:0 10px 30px rgba(90,30,10,.25)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:manipulation}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
button{font:inherit;font-weight:700;min-height:48px;padding:8px 16px;border-radius:14px;border:2px solid var(--pump);background:var(--panel);color:var(--ink);cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button.main{background:var(--pump);color:#fff;font-size:17px}
button.sync{background:var(--gold);border-color:var(--gold);color:#3a2418}
button.prac{border-color:var(--sage)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.card h2{font-size:19px;margin:0 0 8px;color:var(--cran)}
.card ol{margin:0;padding-left:22px}.card li{margin:4px 0}
.dl{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
.note{font-size:14px;color:var(--mute);margin:6px 0 0}
.warn{font-size:14px;background:color-mix(in srgb,var(--cran) 12%,transparent);border-radius:10px;padding:8px 10px;margin-top:8px}
.stats{display:flex;flex-wrap:wrap;gap:14px;margin:0 0 8px}
.stats div{font-size:14px;color:var(--mute)}.stats b{display:block;font-family:Fredoka,sans-serif;font-size:24px;color:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:13px;color:var(--mute);font-weight:500}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.set{display:flex;flex-wrap:wrap;gap:12px;align-items:center;font-size:15px;margin-top:6px}
.set input{width:76px;font:inherit;font-size:16px;padding:6px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);text-align:right}
@media(max-width:600px){table{font-size:13px}}

.view[hidden]{display:none!important}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:center;margin-top:10px}
@media(max-width:760px){.hero{grid-template-columns:1fr}}
.hero svg{width:100%;height:auto;max-height:360px}
.bubble{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px 18px}
.bubble h2{margin:0 0 6px;color:var(--cran);font-size:22px}
.big{font-size:19px;min-height:56px;padding:10px 26px}
.seg{display:inline-flex;border:2px solid var(--pump);border-radius:14px;overflow:hidden}
.seg button{border:0;border-radius:0;min-height:44px}
.seg button.on{background:var(--pump);color:#fff}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{counter-increment:s;position:relative;padding:6px 0 6px 40px;font-size:16px}
.steps li::before{content:counter(s);position:absolute;left:0;top:4px;width:28px;height:28px;border-radius:50%;background:var(--pump);color:#fff;font:700 15px/28px Fredoka,sans-serif;text-align:center}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:10px 0}
.back{background:none;border:0;color:var(--mute);min-height:40px;padding:4px 0;text-decoration:underline}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.bob{animation:bob 2.4s ease-in-out infinite;transform-origin:center}
@media (prefers-reduced-motion:reduce){.bob{animation:none}}

#vSetup .hero{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);align-items:start}
@media(max-width:760px){#vSetup .hero{grid-template-columns:1fr}}
.mapwrap{position:relative;width:100%;max-width:230px;margin:0 auto}
.mapwrap img{width:100%;display:block;border-radius:14px}
.mapwrap .tapmark{position:absolute;width:56px!important;height:56px!important;max-height:none;transform:translate(-50%,-50%);pointer-events:none}
.ring{transform-origin:30px 30px;animation:ripple 1.2s ease-out infinite}
.r2{animation-delay:.6s}
@keyframes ripple{0%{transform:scale(.6);opacity:1}100%{transform:scale(2.2);opacity:0}}
.maptag{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);background:var(--cran);color:#fff;font-size:13px;font-weight:700;padding:4px 10px;border-radius:99px;white-space:nowrap}
@media (prefers-reduced-motion:reduce){.ring{animation:none}}

.lang{align-items:center}
#avatar{width:46px;height:46px;border-radius:50%;object-fit:cover;border:3px solid var(--pump);margin-left:6px}
.foot{text-align:center;padding:18px 12px 28px;color:var(--mute);font-size:14px}
.foot .hearts{font-size:15px;letter-spacing:.5px;margin-bottom:4px}
</style></head><body>

function now(){return performance.now()/1000}
function at(){if(anchor===null)return null;return now()-anchor}   // audio time
function seekPlay(from){const go=()=>{try{au.currentTime=from}catch(e){}const p=au.play();anchor=now()-from;if(p&&p.catch)p.catch(()=>{})};if(au.readyState>=1)go();else{anchor=now()-from;au.addEventListener('loadedmetadata',()=>{const late=now()-anchor;au.currentTime=late;au.play();},{once:true});au.load()}}

function stop(){au.pause();mode='idle';anchor=null}
au.addEventListener('playing',()=>{if(anchor!==null&&Math.abs(au.currentTime-(now()-anchor))<0.5)anchor=now()-au.currentTime});

function ang(t){const A=LV[cur].ang,x=Math.max(0,Math.min(A.length-1.001,t/0.02)),i=Math.floor(x),f=x-i;return A[i]*(1-f)+A[i+1]*f}
function rr(c,x,y,w,h,r){r=Math.max(0,Math.min(r,h/2,w/2));c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
const leaves=Array.from({length:14},(_,i)=>({x:Math.random(),y:Math.random(),s:6+Math.random()*8,v:.02+Math.random()*.03,r:Math.random()*6,c:['#e07b2a','#a3243b','#e9b44c','#c0562a'][i%4]}));
function leaf(c,x,y,s,r,col){c.save();c.translate(x,y);c.rotate(r);c.fillStyle=col;c.beginPath();c.moveTo(0,-s);c.quadraticCurveTo(s,0,0,s);c.quadraticCurveTo(-s,0,0,-s);c.fill();c.restore()}
function pumpkin(c,cx,cy,R,e){

    if(lb){c.fillStyle=cl;c.font='700 12px Fredoka,sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText(lb,cx+x*R*2.08,cy+y*R*2.08)}}
  const g=c.createRadialGradient(cx-R*.3,cy-R*.35,R*.1,cx,cy,R);g.addColorStop(0,'#ffb067');g.addColorStop(1,'#c4561c');c.fillStyle=g;c.beginPath();c.arc(cx,cy,R,0,7);c.fill();
  c.strokeStyle='rgba(110,40,0,.35)';c.lineWidth=1.5;for(let k=0;k<8;k++){const th=(k*45+a)*Math.PI/180;c.beginPath();c.moveTo(cx+Math.cos(th)*R*.25,cy+Math.sin(th)*R*.25);c.lineTo(cx+Math.cos(th)*R*.95,cy+Math.sin(th)*R*.95);c.stroke()}
  c.fillStyle='#7f9a5a';c.beginPath();c.arc(cx,cy,R*.22,0,7);c.fill();
  c.fillStyle='#e9b44c';c.beginPath();c.moveTo(cx,cy-R*1.1);c.lineTo(cx-6,cy-R*1.1-11);c.lineTo(cx+6,cy-R*1.1-11);c.fill();
}
let lastT=performance.now(),flashTxt='';

  c.textAlign='left';c.textBaseline='bottom';c.fillStyle='#f7ead6';c.font='700 15px "Noto Sans TC",sans-serif';c.fillText(t.done+' '+n+' / '+P.count,16,H-12);

function practiceHit(){const A=at();if(mode!=='prac'||A===null)return;const e=A-GO_T,t=tr();

  judge={at:performance.now(),c:ok?(Math.abs(d)<.06?'#8fb366':'#e9b44c'):'#d9435a',t:ok?(Math.abs(d)<.06?t.perfect:(d<0?t.early:t.late)+Math.abs(d).toFixed(2)+t.sec+t.ok):(d<0?t.tooE:t.tooL)+Math.abs(d).toFixed(2)+t.sec}}
